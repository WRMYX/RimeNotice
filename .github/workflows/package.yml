name: Package application / 应用打包
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Draft release tag / 草稿发布标签，例如 v1.0.2；留空仅生成产物。'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: package-${{ inputs.release_version || github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Package / 打包产物
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout / 检出源码
        uses: actions/checkout@v6
      - name: Setup .NET / 配置 .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Resolve version / 解析版本
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:REQUESTED_VERSION.Trim() }
          if ($tag) {
            if ($tag -notmatch '^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use vMAJOR.MINOR.PATCH.' }
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            [xml]$manifest = Get-Content RimeNotice/Package.appxmanifest -Raw
            $version = [string]$manifest.Package.Identity.Version
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Initialize and check / 初始化与检查
        run: |
          ./tools/Initialize-Build.ps1
          dotnet run --project tools/RuleChecks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Checks failed.' }
          ./tests/RimeNotice.Update.Tests/Test-PortableUpdate.ps1
      - name: Import signing identity / 导入可选签名身份
        env:
          SIGNING_PFX: ${{ secrets.RN_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.RN_SIGNING_PASSWORD }}
        run: |
          if (!$env:SIGNING_PFX) { Write-Output 'No stable signer configured: MSIX is a local test package.'; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP 'rn-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($env:SIGNING_PFX))
            $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation Cert:/CurrentUser/My
            "RN_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally { if (Test-Path $path) { Remove-Item -LiteralPath $path -Force } }
      - name: Build portable and MSIX / 打包便携版与安装版
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          STORE_IDENTITY: ${{ secrets.RN_STORE_IDENTITY_JSON }}
        run: |
          New-Item -ItemType Directory artifacts/Release -Force | Out-Null
          $portable = ./tools/Build-Portable.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/Release
          $package = ./tools/Build-MSIX.ps1 -Version $env:PACKAGE_VERSION -PublishedDirectory $portable.Stage -OutputDirectory artifacts/MSIX
          Compress-Archive -LiteralPath $package.Package,$package.Certificate -DestinationPath "artifacts/Release/RimeNotice-$env:PACKAGE_VERSION-MSIX-with-certificate-x64.zip"
          if ($env:STORE_IDENTITY) {
            $identity = Join-Path $env:RUNNER_TEMP 'rn-store-identity.json'
            try {
              $env:STORE_IDENTITY | Set-Content -LiteralPath $identity -Encoding utf8
              ./tools/Build-MSIX.ps1 -Store -StoreIdentityFile $identity -Version $env:PACKAGE_VERSION -PublishedDirectory $portable.Stage -OutputDirectory artifacts/Store
              "RN_STORE_READY=true" >> $env:GITHUB_ENV
            } finally { if (Test-Path $identity) { Remove-Item -LiteralPath $identity -Force } }
          } else {
            ./tools/Build-MSIX.ps1 -Store -Version $env:PACKAGE_VERSION -PublishedDirectory $portable.Stage -OutputDirectory artifacts/Store
            "RN_STORE_READY=true" >> $env:GITHUB_ENV
          }
          Get-ChildItem artifacts/Release -Filter *.zip | ForEach-Object { (Get-FileHash $_.FullName).Hash.ToLowerInvariant()+'  '+$_.Name } | Set-Content artifacts/Release/SHA256.txt
      - name: Validate release artifacts / 校验发布产物
        run: |
          $portable = @(Get-ChildItem artifacts/Release -Filter '*-Portable-x64.zip' -File)
          $msix = @(Get-ChildItem artifacts/Release -Filter '*-MSIX-with-certificate-x64.zip' -File)
          if ($portable.Count -ne 1 -or $msix.Count -ne 1) { throw 'Expected exactly one portable archive and one MSIX archive.' }
          $checksumPath = 'artifacts/Release/SHA256.txt'
          if (!(Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'Missing SHA256.txt.' }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath $checksumPath) {
            if ($line -notmatch '^([0-9a-fA-F]{64})  (.+)$') { throw 'Invalid SHA256.txt entry.' }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($checksums.ContainsKey($name)) { throw "Duplicate checksum entry: $name" }
            $checksums[$name] = $hash
          }
          if ($checksums.Count -ne 2) { throw 'Expected checksums for exactly two release archives.' }
          foreach ($archive in @($portable[0], $msix[0])) {
            if ($archive.Length -eq 0) { throw "Empty release archive: $($archive.Name)" }
            if (!$checksums.ContainsKey($archive.Name)) { throw "Missing checksum for $($archive.Name)" }
            $actualHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
            if ($actualHash -ne $checksums[$archive.Name]) { throw "Checksum mismatch: $($archive.Name)" }
          }
          if ($env:RN_STORE_READY -eq 'true') {
            $store = @(Get-ChildItem artifacts/Store -Filter '*.msix' -File)
            if ($store.Count -ne 1 -or $store[0].Length -eq 0) { throw 'Expected exactly one nonempty Store package.' }
          }
      - name: Upload portable archive / 上传便携版
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RimeNotice-Portable-x64
          path: |
            artifacts/Release/*-Portable-x64.zip
            artifacts/Release/SHA256.txt
          archive: true
          if-no-files-found: error
      - name: Upload MSIX and public certificate / 上传 MSIX 与证书
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RimeNotice-MSIX-with-certificate-x64
          path: |
            artifacts/Release/*-MSIX-with-certificate-x64.zip
            artifacts/Release/SHA256.txt
          archive: true
          if-no-files-found: error
      - name: Upload Store package / 上传 Store 提交包
        uses: actions/upload-artifact@v7.0.2
        if: env.RN_STORE_READY == 'true'
        with:
          name: RimeNotice-Store-x64
          path: artifacts/Store/*.msix
          archive: true
          if-no-files-found: error
      - name: Create draft release / 创建草稿发布
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $files = @(Get-ChildItem artifacts/Release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --draft --target $env:RELEASE_COMMIT --title "RimeNotice $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed.' }
